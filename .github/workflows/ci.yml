name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Test metadata parser
        run: node --test scripts/sync-repos-metadata.test.js
      - name: Restore repos metadata
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: src/assets/repos.json
          key: repos-metadata-${{ github.run_id }}
          restore-keys: |
            repos-metadata-
      - name: Sync repos metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-repos-metadata.js src/assets/repos.json
      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn run build
      - name: Save repos metadata
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: src/assets/repos.json
          key: repos-metadata-${{ github.run_id }}
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./dist
          external_repository: manuzhang/awesome-streaming
